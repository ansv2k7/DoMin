<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dò Mìn 16×16 - Thành An</title>
<style>
  :root{
    --bg-deep:#161a24;
    --bg-panel:#1f2530;
    --bg-panel-2:#252c3a;
    --cell-up-a:#3d4863;
    --cell-up-b:#2b3245;
    --cell-up-edge:#4d5b7c;
    --cell-down:#11141c;
    --cell-down-edge:#080a10;
    --accent:#e6a13d;
    --accent-dim:#a97a2c;
    --danger:#e0524a;
    --text:#e9e7e0;
    --text-dim:#8c93a6;
    --lcd-bg:#150404;
    --lcd-fg:#ff4b3e;
    --num1:#5b9bf0;
    --num2:#57c98a;
    --num3:#ef6a62;
    --num4:#a689e8;
    --num5:#d98a3d;
    --num6:#3ecfcb;
    --num7:#e9e7e0;
    --num8:#8c93a6;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:
      radial-gradient(1200px 800px at 50% -10%, #232a3a 0%, var(--bg-deep) 55%);
    color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:auto;
    -webkit-tap-highlight-color: transparent;
  }
  .stage{
    position:relative;
    padding:18px;
    width:min(96vw,640px);
  }
  .title-row{
    text-align:center;
    margin-bottom:10px;
    letter-spacing:.14em;
    font-size:.72rem;
    text-transform:uppercase;
    color:var(--text-dim);
    font-weight:600;
  }
  .title-row b{
    color:var(--accent);
    letter-spacing:.02em;
  }
  .panel{
    position:relative;
    background:linear-gradient(180deg,var(--bg-panel),var(--bg-panel-2));
    border-radius:16px;
    padding:14px;
    box-shadow:
      0 20px 50px -20px rgba(0,0,0,.7),
      0 1px 0 rgba(255,255,255,.04) inset,
      0 -1px 0 rgba(0,0,0,.4) inset;
    border:1px solid #333c4f;
  }
  /* mode toggle - corner of the game */
  .mode-toggle{
    position:absolute;
    top:-14px;
    right:-14px;
    width:52px;
    height:52px;
    border-radius:50%;
    border:2px solid var(--accent-dim);
    background:radial-gradient(circle at 32% 28%, #3a4257, #1c2130 75%);
    color:var(--accent);
    font-size:1.35rem;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 8px 18px -6px rgba(0,0,0,.7), 0 0 0 4px var(--bg-deep);
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    z-index:5;
    user-select:none;
  }
  .mode-toggle:active{transform:scale(.92);}
  .mode-toggle.flag-mode{
    border-color:var(--accent);
    box-shadow:0 0 0 4px var(--bg-deep), 0 0 16px 2px rgba(230,161,61,.55);
  }
  .mode-toggle .hint{
    position:absolute;
    bottom:-20px;
    right:2px;
    font-size:.6rem;
    letter-spacing:.06em;
    color:var(--text-dim);
    white-space:nowrap;
    text-transform:uppercase;
  }

  .hud{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
    padding:8px 10px;
    background:var(--cell-down);
    border-radius:10px;
    border:1px solid #0a0d13;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.6);
  }
  .lcd{
    background:var(--lcd-bg);
    color:var(--lcd-fg);
    font-family:'Courier New',monospace;
    font-weight:700;
    font-size:1.4rem;
    letter-spacing:.12em;
    padding:5px 10px;
    border-radius:6px;
    min-width:74px;
    text-align:center;
    text-shadow:0 0 8px rgba(255,75,62,.75);
    border:1px solid #2a0808;
    box-shadow:inset 0 1px 4px rgba(0,0,0,.8);
  }
  .face-btn{
    width:44px;
    height:44px;
    border-radius:10px;
    background:linear-gradient(180deg,var(--cell-up-a),var(--cell-up-b));
    border:1px solid var(--cell-up-edge);
    font-size:1.4rem;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 3px 0 #10131c, 0 6px 10px -4px rgba(0,0,0,.6);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .face-btn:active{
    transform:translateY(2px);
    box-shadow:0 1px 0 #10131c, 0 2px 4px -2px rgba(0,0,0,.6);
  }

  .board{
    display:grid;
    grid-template-columns:repeat(16, 1fr);
    gap:2px;
    background:#0c0f16;
    padding:6px;
    border-radius:10px;
    border:1px solid #0a0d13;
    box-shadow:inset 0 2px 10px rgba(0,0,0,.6);
    touch-action: manipulation;
  }
  .cell{
    position:relative;
    aspect-ratio:1/1;
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(11px, 2.4vw, 15px);
    font-weight:800;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    background:linear-gradient(155deg,var(--cell-up-a),var(--cell-up-b));
    box-shadow:
      inset 1px 1px 0 rgba(255,255,255,.12),
      inset -1px -1px 0 rgba(0,0,0,.35);
    transition:filter .1s ease, transform .06s ease;
  }
  .cell:active{filter:brightness(1.08);}
  .cell.revealed{
    cursor:default;
    background:var(--cell-down);
    box-shadow:inset 0 0 0 1px var(--cell-down-edge);
  }
  .cell.revealed.zero{background:var(--cell-down);}
  .cell.mine-cell{
    background:linear-gradient(155deg,#3a2226,#241416);
  }
  .cell.mine-cell.exploded{
    background:linear-gradient(155deg,var(--danger),#7a1d18);
    box-shadow:0 0 14px 2px rgba(224,82,74,.8);
  }
  .cell.flagged::after{
    content:"⚑";
    color:var(--accent);
    font-size:clamp(12px,2.6vw,17px);
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.6));
  }
  .cell.chord-glow{
    box-shadow:0 0 0 2px var(--accent) inset, 0 0 10px 1px rgba(230,161,61,.6);
  }
  .cell .mine-icon{font-size:clamp(11px,2.4vw,15px);}
  .n1{color:var(--num1);} .n2{color:var(--num2);} .n3{color:var(--num3);}
  .n4{color:var(--num4);} .n5{color:var(--num5);} .n6{color:var(--num6);}
  .n7{color:var(--num7);} .n8{color:var(--num8);}

  .status-line{
    margin-top:10px;
    text-align:center;
    font-size:.8rem;
    min-height:1.2em;
    color:var(--text-dim);
    letter-spacing:.02em;
  }
  .status-line.win{color:var(--num2);font-weight:700;}
  .status-line.lose{color:var(--danger);font-weight:700;}
</style>
</head>
<body>

<div class="stage">
  <div class="title-row">DÒ <b>MÌN</b> · By Thành An</div>
  <div class="panel">
    <button class="mode-toggle" id="modeToggle" title="Đổi chế độ">
      🔍
      <span class="hint" id="modeHint">Dò</span>
    </button>

    <div class="hud">
      <div class="lcd" id="mineCounter">040</div>
      <div class="face-btn" id="resetBtn">🙂</div>
      <div class="lcd" id="timer">000</div>
    </div>

    <div class="board" id="board"></div>

    <div class="status-line" id="statusLine">Nhấn giữ một ô số đã mở để dò nhanh các ô xung quanh</div>
  </div>
</div>

<script>
(function(){
  const SIZE = 16;
  const MINES = 40;
  const boardEl = document.getElementById('board');
  const mineCounterEl = document.getElementById('mineCounter');
  const timerEl = document.getElementById('timer');
  const resetBtn = document.getElementById('resetBtn');
  const modeToggle = document.getElementById('modeToggle');
  const modeHint = document.getElementById('modeHint');
  const statusLine = document.getElementById('statusLine');

  let grid = [];         // {mine, revealed, flagged, adj, el}
  let firstClickDone = false;
  let gameOver = false;
  let flagsPlaced = 0;
  let revealedCount = 0;
  let timerInterval = null;
  let seconds = 0;
  let mode = 'dig'; // 'dig' | 'flag'

  const LONG_PRESS_MS = 450;
  let pressTimer = null;
  let longPressFired = false;
  let pressCell = null;

  function idx(r,c){ return r*SIZE+c; }

  function buildEmptyGrid(){
    grid = [];
    boardEl.innerHTML = '';
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const cellData = {mine:false, revealed:false, flagged:false, adj:0, r, c};
        const el = document.createElement('div');
        el.className = 'cell';
        el.dataset.r = r;
        el.dataset.c = c;
        boardEl.appendChild(el);
        cellData.el = el;
        grid.push(cellData);
        attachHandlers(el, cellData);
      }
    }
  }

  function neighbors(r,c){
    const res = [];
    for(let dr=-1;dr<=1;dr++){
      for(let dc=-1;dc<=1;dc++){
        if(dr===0 && dc===0) continue;
        const nr=r+dr, nc=c+dc;
        if(nr>=0 && nr<SIZE && nc>=0 && nc<SIZE) res.push(grid[idx(nr,nc)]);
      }
    }
    return res;
  }

  function placeMines(excludeR, excludeC){
    const forbidden = new Set();
    forbidden.add(idx(excludeR,excludeC));
    neighbors(excludeR,excludeC).forEach(n => forbidden.add(idx(n.r,n.c)));

    let placed = 0;
    while(placed < MINES){
      const i = Math.floor(Math.random()*SIZE*SIZE);
      if(forbidden.has(i)) continue;
      if(grid[i].mine) continue;
      grid[i].mine = true;
      placed++;
    }
    grid.forEach(cell => {
      if(cell.mine) return;
      cell.adj = neighbors(cell.r,cell.c).filter(n=>n.mine).length;
    });
  }

  function startTimer(){
    if(timerInterval) return;
    timerInterval = setInterval(()=>{
      seconds++;
      if(seconds>999) seconds=999;
      timerEl.textContent = String(seconds).padStart(3,'0');
    },1000);
  }
  function stopTimer(){
    clearInterval(timerInterval);
    timerInterval = null;
  }

  function updateMineCounter(){
    const remaining = MINES - flagsPlaced;
    mineCounterEl.textContent = String(remaining).padStart(3,'0');
  }

  function setStatus(text, cls){
    statusLine.textContent = text;
    statusLine.className = 'status-line' + (cls ? ' '+cls : '');
  }

  function reset(){
    gameOver = false;
    firstClickDone = false;
    flagsPlaced = 0;
    revealedCount = 0;
    seconds = 0;
    stopTimer();
    timerEl.textContent = '000';
    updateMineCounter();
    resetBtn.textContent = '🙂';
    setStatus('Nhấn giữ một ô số đã mở để dò nhanh các ô xung quanh');
    buildEmptyGrid();
  }

  function renderCell(cell){
    const el = cell.el;
    el.className = 'cell';
    el.innerHTML = '';
    if(cell.revealed){
      el.classList.add('revealed');
      if(cell.mine){
        el.classList.add('mine-cell');
        if(cell.exploded) el.classList.add('exploded');
        el.innerHTML = '<span class="mine-icon">💣</span>';
      } else if(cell.adj>0){
        el.textContent = cell.adj;
        el.classList.add('n'+cell.adj);
      } else {
        el.classList.add('zero');
      }
    } else {
      if(cell.flagged) el.classList.add('flagged');
    }
  }

  function revealCell(cell){
    if(cell.revealed || cell.flagged || gameOver) return;
    cell.revealed = true;
    revealedCount++;
    renderCell(cell);

    if(cell.mine){
      loseGame(cell);
      return;
    }
    if(cell.adj === 0){
      neighbors(cell.r,cell.c).forEach(n=>{
        if(!n.revealed && !n.flagged) revealCell(n);
      });
    }
    checkWin();
  }

  function loseGame(explodedCell){
    gameOver = true;
    stopTimer();
    explodedCell.exploded = true;
    grid.forEach(c=>{
      if(c.mine && !c.revealed){ c.revealed = true; }
      if(c.mine) renderCell(c);
    });
    resetBtn.textContent = '😵';
    setStatus('Bạn đã trúng mìn! Nhấn mặt cười để chơi lại.', 'lose');
  }

  function checkWin(){
    if(gameOver) return;
    const total = SIZE*SIZE;
    if(revealedCount === total - MINES){
      gameOver = true;
      stopTimer();
      grid.forEach(c=>{
        if(c.mine && !c.flagged){
          c.flagged = true;
          renderCell(c);
        }
      });
      flagsPlaced = MINES;
      updateMineCounter();
      resetBtn.textContent = '😎';
      setStatus('Chúc mừng! Bạn đã dò hết bãi mìn.', 'win');
    }
  }

  function toggleFlag(cell){
    if(cell.revealed || gameOver) return;
    cell.flagged = !cell.flagged;
    flagsPlaced += cell.flagged ? 1 : -1;
    updateMineCounter();
    renderCell(cell);
  }

  function glowNeighbors(cell, on){
    neighbors(cell.r,cell.c).forEach(n=>{
      if(!n.revealed && !n.flagged){
        n.el.classList.toggle('chord-glow', on);
      }
    });
  }

  function chordReveal(cell){
    if(!cell.revealed || cell.mine || cell.adj===0 || gameOver) return;
    const nbs = neighbors(cell.r,cell.c);
    const flaggedCount = nbs.filter(n=>n.flagged).length;
    glowNeighbors(cell, false);
    if(flaggedCount !== cell.adj) return;
    nbs.forEach(n=>{
      if(!n.flagged && !n.revealed) revealCell(n);
    });
  }

  function doPrimaryAction(cell){
    if(gameOver) return;
    if(!firstClickDone){
      placeMines(cell.r, cell.c);
      firstClickDone = true;
      startTimer();
    }
    if(mode === 'flag'){
      toggleFlag(cell);
    } else {
      if(cell.flagged) return;
      revealCell(cell);
    }
  }

  function doLongPressAction(cell){
    if(gameOver) return;
    if(!firstClickDone) return; // nothing to chord/flag before board exists meaningfully
    if(cell.revealed && cell.adj>0){
      chordReveal(cell);
    } else if(!cell.revealed){
      toggleFlag(cell);
    }
  }

  function attachHandlers(el, cell){
    el.addEventListener('contextmenu', e=>{
      e.preventDefault();
      if(gameOver) return;
      if(!firstClickDone){
        // right click before first move: just place a flag is fine, no mine placement needed
      }
      toggleFlag(cell);
    });

    el.addEventListener('pointerdown', e=>{
      if(e.button === 2) return;
      longPressFired = false;
      pressCell = cell;
      if(cell.revealed && cell.adj>0){
        glowNeighbors(cell, true);
      }
      pressTimer = setTimeout(()=>{
        longPressFired = true;
        doLongPressAction(cell);
      }, LONG_PRESS_MS);
    });

    const clearPress = ()=>{
      clearTimeout(pressTimer);
      if(pressCell) glowNeighbors(pressCell, false);
    };

    el.addEventListener('pointerup', e=>{
      if(e.button === 2) return;
      clearTimeout(pressTimer);
      if(pressCell) glowNeighbors(pressCell, false);
      if(!longPressFired){
        doPrimaryAction(cell);
      }
      longPressFired = false;
      pressCell = null;
    });

    el.addEventListener('pointerleave', clearPress);
    el.addEventListener('pointercancel', clearPress);
  }

  modeToggle.addEventListener('click', ()=>{
    mode = mode === 'dig' ? 'flag' : 'dig';
    if(mode === 'flag'){
      modeToggle.textContent = '⚑';
      modeToggle.classList.add('flag-mode');
      const hint = document.createElement('span');
      hint.className = 'hint';
      hint.id = 'modeHint';
      hint.textContent = 'Cắm cờ';
      modeToggle.appendChild(hint);
    } else {
      modeToggle.textContent = '🔍';
      modeToggle.classList.remove('flag-mode');
      const hint = document.createElement('span');
      hint.className = 'hint';
      hint.id = 'modeHint';
      hint.textContent = 'Dò';
      modeToggle.appendChild(hint);
    }
  });

  resetBtn.addEventListener('click', reset);

  boardEl.addEventListener('contextmenu', e=>e.preventDefault());

  reset();
})();
</script>
</body>
</html>
